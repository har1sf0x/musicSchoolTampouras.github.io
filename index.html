</head>
<body>
    <div class="container">
        <h1>Επιλογή παρτιτούρας</h1>

            <select id="photoSelect">

                <option value="Ασκήσεις_α_no_001">Ασκήσεις (α) - no. 001</option>

                <option value="Ασκήσεις_α_no_002">Ασκήσεις (α) - no. 002</option>

                <option value="Γαϊτανάκι_μου_πλεγμένο">Γαϊτανάκι μου πλεγμένο</option>

                <option value="Γιουρούκικος_α">Γιουρούκικος (α)</option>

                <option value="Είσαι_άγγελος_ωραίος">Είσαι άγγελος ωραίος</option>

                <option value="Ένα_μικρό_φυντάνι">Ένα μικρό φυντάνι</option>

                <option value="Κάλαντα_Πελοποννήσου_Χριστουγέννων">Κάλαντα Πελοποννήσου (Χριστουγέννων)</option>

                <option value="Κάτω_στο_γιαλό_α">Κάτω στο γιαλό (α)</option>

                <option value="Κάτω_στο_γιαλό_β">Κάτω στο γιαλό (β)</option>

                <option value="Μαζωμένος">Μαζωμένος</option>

                <option value="Μαλαματένιος_αργαλειός">Μαλαματένιος αργαλειός</option>

                <option value="Μαντηλάτος_Νικρίζ">Μαντηλάτος Νικρίζ</option>

                <option value="Μεγαρίτικος_Καρσιλαμάς">Μεγαρίτικος Καρσιλαμάς</option>
                
                <option value="Νταρσά_α">Νταρσά (α)</option>

                <option value="Νταρσά_β">Νταρσά (β)</option>

                <option value="Ντε_βρε_ντε">Ντε βρε ντε</option>

                <option value="Ο_Γιώργος">Ο Γιώργος</option>

                <option value="Ποδαράκι_α">Ποδαράκι (α)</option>

                <option value="Ποδαράκι_β">Ποδαράκι (β)</option>

                <option value="Ποδαράκι_γ">Ποδαράκι (γ)</option>
                
                <option value="ρυθμοί_Καλαματιανός">Ρυθμοί - Καλαματιανός</option>

                <option value="Σαν_απόψι_τέτοιαν_ώρα">Σαν απόψι τέτοιαν ώρα</option>

                <option value="Το_Μαργούδι_κι_ο_Αλεξανδρής">Το Μαργούδι κι ο Αλεξανδρής</option>

                <option value="Τσιφτ">Τσιφτ</option>

                <option value="Χαρμάνταλι">Χαρμάνταλι</option> -->
            </select>
        </div>

        <div class="radio-group" id="radioGroup">
            <label>Επιλέξτε έκδοση:</label>
            <label>
                <input type="radio" name="version" value="">
                Κανονική
            </label>
            <label>
                <input type="radio" name="version" value="_πενιές" checked>
                Πενιές
            </label>
            <label>
                <input type="radio" name="version" value="_inΝτο">
                in Ντο
            </label>
            <label>
                <input type="radio" name="version" value="_inΝτο_πενιές">
                in Ντο - Πενιές
            </label>
        </div>

        <div class="toggle-button" id="toggleButton">
            <label>Δάχτυλα:</label>
            <label class="switch">
              <input type="checkbox" name="fingers" checked>
              <span class="slider round"></span>
            </label>
        </div>

        <div id="sliderContainer">
            <p>Σμίκρυνση:</p>
            <input type="range" min="10" max="100" value="100" id="zoomSlider">
            <p id="zoomIndicator">100%</p>
        </div>

        <div class="photo-container">
            <div id="placeholder" class="placeholder">
                Διαλέξτε μία παρτιτούρα
            </div>
            <img id="sheetImage" class="sheet" src="" alt="">
        </div>

        <button id="downloadButton" class="download-button">
            <!-- 📥 Λήψη PDF -->
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.5 3H12H7C5.89543 3 5 3.89543 5 5V19C5 20.1046 5.89543 21 7 21H7.5M13.5 3L19 8.625M13.5 3V7.625C13.5 8.17728 13.9477 8.625 14.5 8.625H19M19 8.625V9.75V12V19C19 20.1046 18.1046 21 17 21H16.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M12 12V20M12 20L9.5 17.5M12 20L14.5 17.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><p>Λήψη PDF</p>
        </button>
        
        <!-- Modal for iOS fallback -->
        <div id="modal" class="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <img id="modalImage" src="" alt="">
        </div>
    </div>
</body>
</html>
